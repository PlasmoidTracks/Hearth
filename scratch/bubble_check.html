<!doctype html>
<!-- Standalone fixture for the transcript-bubble change: reproduces the exact markup
     chat.js emits (tool chip / reasoning / caption / transient) plus base.css and a
     Tailwind-like utility subset, so computed heights can be measured in headless
     Chrome without booting the server. NOT part of the app. -->
<!-- Run it through headless Chromium with the real Tailwind runtime injected:
       python3 - <<'PY'
       from playwright.sync_api import sync_playwright
       tw = open("hearth/static/vendor/tailwind.js").read()
       with sync_playwright() as p:
           b = p.chromium.launch(args=["--no-sandbox"]); pg = b.new_page()
           pg.add_init_script(tw); pg.goto(__file__); pg.wait_for_timeout(2000)
           print(pg.evaluate("window.__report()")); print(pg.evaluate("window.__toggleCheck()"))
       PY
     Reports computed max-height/overflow per bubble, and toggles the first chip. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../hearth/static/base.css">
<style>
  /* Stands in for the vendored Tailwind JIT: only the utilities used here. */
  html,body{margin:0;background:#020617;color:#e2e8f0;font-family:sans-serif}
  .h-full{height:100%} .flex{display:flex} .flex-col{flex-direction:column}
  .flex-1{flex:1 1 0%} .overflow-auto{overflow:auto} .p-3{padding:.75rem}
  .space-y-3>*+*{margin-top:.75rem} .max-w-\[85\%\]{max-width:85%}
  .text-\[11px\]{font-size:11px} .text-\[12px\]{font-size:12px}
  .font-mono{font-family:ui-monospace,monospace} .rounded-lg{border-radius:.5rem}
  .bg-slate-900{background:#0f172a} .border{border-width:1px;border-style:solid}
  .border-slate-700{border-color:#334155} .border-slate-800{border-color:#1e293b}
  .border-t{border-top-width:1px;border-top-style:solid} .border-slate-700\/60{border-color:#33415599}
  .cursor-pointer{cursor:pointer} .select-none{user-select:none}
  .italic{font-style:italic} .whitespace-pre-wrap{white-space:pre-wrap} .break-words{overflow-wrap:break-word}
  .px-2{padding-left:.5rem;padding-right:.5rem} .py-1{padding-top:.25rem;padding-bottom:.25rem}
  .px-3{padding-left:.75rem;padding-right:.75rem} .pb-2{padding-bottom:.5rem} .pt-1{padding-top:.25rem}
  .mt-1{margin-top:.25rem} .mb-1{margin-bottom:.25rem} .w-full{width:100%}
  .justify-start{justify-content:flex-start} .text-slate-300{color:#cbd5e1}
  .text-slate-400{color:#94a3b8} .text-slate-200{color:#e2e8f0} .text-slate-500{color:#64748b}
  pre{margin:0;font-family:inherit} body{font-size:14px;line-height:1.43}
</style>
</head><body class="h-full flex flex-col">
<div id="messages" class="flex-1 overflow-auto p-3 space-y-3"></div>
<script>
// Mirrors chat.js builders (chip markup kept byte-identical to the real ones).
const msgsEl = document.getElementById('messages');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function labelTool(){ return 'tool'; }

function toolChip(name, ok, preview){
  const el = document.createElement('details');
  el.open = true;
  el.className = 'tool-chip text-[11px] font-mono bg-slate-900 border border-slate-700 rounded-lg max-w-[85%]';
  el.innerHTML = `<summary class="cursor-pointer select-none">` +
    `<span class="text-slate-400">${esc(labelTool())}:</span> <b class="text-slate-200">${esc(name)}</b> ` +
    `<span class="${ok?'text-emerald-400':'text-red-400'}">${ok?'✓':'✗'}</span></summary>` +
    `<div class="bubble-body border-t border-slate-700/60">` +
    `<pre class="text-slate-300 whitespace-pre-wrap">${esc(preview||'')}</pre></div>`;
  msgsEl.appendChild(el);
  return el;
}
function addReasoningBlock(text){
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start w-full text-[12px]';
  const d = document.createElement('details');
  d.open = true;
  d.className = 'mb-1 rounded-lg border border-slate-800 bg-slate-900';
  const sum = document.createElement('summary');
  sum.className = 'cursor-pointer px-2 py-1 text-slate-500 select-none';
  sum.textContent = 'Reasoning';
  const body = document.createElement('div');
  body.className = 'bubble-body px-3 pb-2 pt-1 text-slate-400 italic whitespace-pre-wrap break-words';
  body.textContent = text || '';
  d.appendChild(sum); d.appendChild(body); wrap.appendChild(d);
  msgsEl.appendChild(wrap);
}
function pendingChip(name, summary){
  const el = document.createElement('div');
  el.className = 'chip-transient text-[11px] font-mono bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 max-w-[85%]';
  el.innerHTML = `<span>●</span> <b>${esc(name)}</b> <span class="text-slate-400">${esc(summary||'')}</span>`;
  msgsEl.appendChild(el);
}
const long = Array.from({length:120}, (_,i)=>`line ${i+1}: some tool output that goes on and on`).join('\n');
const shortOut = 'ok: packed demo.zip';

toolChip('fs_read', true, long);            // long -> must cap + scroll
toolChip('zip_pack', true, shortOut);       // short -> must NOT be capped
addReasoningBlock(long);                    // long thinking -> cap + scroll, open
addReasoningBlock('a brief thought');       // short -> natural height
pendingChip('exec', 'sandboxed · echo hi'); // transient, one line

// Report what a browser actually computed.
window.__report = () => {
  const out = [];
  document.querySelectorAll('#messages > *').forEach((el,i)=>{
    const body = el.matches('details') ? el.querySelector('.bubble-body') : el;
    const cs = getComputedStyle(body);
    const collapsed = el.matches('details') ? !el.open : null;
    out.push({i, tag: el.tagName.toLowerCase(), cls: (el.className||'').slice(0,28),
              chipH: Math.round(el.getBoundingClientRect().height),
              bodyH: Math.round(body.getBoundingClientRect().height),
              scrollH: body.scrollHeight, maxH: cs.maxHeight, overflowY: cs.overflowY});
  });
  return out;
};
// Collapse interaction check on the first chip.
window.__toggleCheck = () => {
  const d = document.querySelector('#messages details.tool-chip');
  const before = Math.round(d.getBoundingClientRect().height);
  d.open = false;
  const after = Math.round(d.getBoundingClientRect().height);
  d.open = true;
  return {before, after, summaryVisible: getComputedStyle(d.querySelector('summary')).display};
};
</script>
</body></html>
