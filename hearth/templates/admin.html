{% extends "base.html" %}
{% block title %}Admin · Hearth{% endblock %}
{% block body %}
<div class="min-h-full">
  <header class="border-b border-slate-800 bg-slate-900/60 px-4 py-3 flex items-center gap-4">
    <a href="/chat" class="text-sky-400 text-sm hover:underline">← Chat</a>
    <h1 class="font-semibold">Admin</h1>
    <span class="ml-auto text-xs text-slate-400">{{ user.username }}</span>
  </header>

  <div class="p-4 flex gap-2 border-b border-slate-800 text-sm overflow-x-auto sticky top-0 z-10 bg-slate-950/90 backdrop-blur">
    <button data-tab="model" class="tab px-3 py-1.5 md:py-1 rounded-lg bg-slate-800 shrink-0">Model</button>
    <button data-tab="agent" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Agent</button>
    <button data-tab="tools" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Tools</button>
    <button data-tab="users" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Users</button>
    <button data-tab="docs" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Protocols & Prompts</button>
    <button data-tab="log" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Server Log</button>
    <button data-tab="audit" class="tab px-3 py-1.5 md:py-1 rounded-lg hover:bg-slate-800 shrink-0">Audit</button>
  </div>

  <section id="panel" class="p-4 max-w-5xl"></section>
</div>
{% endblock %}
{% block scripts %}<script src="/static/admin.js"></script>{% endblock %}
